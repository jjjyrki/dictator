[package]
name = "dictator-stt"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.100"
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
jni = "0.21.1"
moshi = "0.6.1"
sentencepiece = "0.11.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[patch.crates-io]
# sentencepiece-sys 0.11.3 omits liblog when CMake builds its Android shared
# library. Keep the patch local until the upstream crate releases that fix.
sentencepiece-sys = { path = "vendor/sentencepiece-sys" }
